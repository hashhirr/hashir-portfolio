<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hashir Qureshi · Full Stack Engineer & React Native Developer</title>
    <meta
      name="description"
      content="Hashir Ahmad Qureshi: co-founder of Flockbee and full stack engineer who built Mistify, shipping production mobile and web platforms with React Native, Next.js, NestJS, Hasura, PostgreSQL/PostGIS, Firebase and AWS."
    />
    <meta
      name="keywords"
      content="Hashir Qureshi, Hashir Ahmad Qureshi, full stack engineer, React Native developer, Next.js, NestJS, Hasura, GraphQL, PostGIS, Firebase, AWS, portfolio"
    />
    <meta name="author" content="Hashir Ahmad Qureshi" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#090a0d" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hashir Qureshi · Co-founder & Full Stack Engineer" />
    <meta
      property="og:description"
      content="Production mobile & web platforms, from architecture to app-store release."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hashir Qureshi · Co-founder & Full Stack Engineer" />
    <meta
      name="twitter:description"
      content="Production mobile & web platforms, from architecture to app-store release."
    />

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Without JS, show content that would otherwise fade in on scroll -->
    <noscript>
      <style>
        [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
